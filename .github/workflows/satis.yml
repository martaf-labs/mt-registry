# .github/workflows/satis.yml
#
# GitHub Action : Build & Deploy du registry mt-registry
#
# Se déclenche :
#   - Manuellement (workflow_dispatch)
#   - Via webhook depuis n'importe quel package mt-* (repository_dispatch)
#   - À chaque modification de satis.json sur main

name: Build & Deploy Registry

on:
  workflow_dispatch:

  repository_dispatch:
    types:
      - satis-update

  push:
    branches:
      - main
    paths:
      - satis.json

# Permissions explicites pour pouvoir écrire sur gh-pages
permissions:
  contents: write

# Force Node.js 24 pour toutes les actions du workflow
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build mt-registry
    runs-on: ubuntu-latest

    steps:
      # 1. Récupérer le code du repo mt-registry
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Installer PHP
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      # 3. Construire le registry via Satis
      #    → --skip-errors : ignore les repos vides ou inaccessibles
      - name: Build Registry
        run: |
          composer global config allow-plugins.composer/satis true
          composer global require composer/satis:dev-main --no-interaction --quiet --ignore-platform-reqs
          /tmp/composer/vendor/bin/satis build satis.json public --skip-errors
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.SATIS_GITHUB_TOKEN }}"}}'
          COMPOSER_HOME: /tmp/composer

      # 4. Déployer sur GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: true
          force_orphan: false
          commit_message: "chore: rebuild mt-registry [${{ github.event_name }}]"