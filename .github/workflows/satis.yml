# .github/workflows/satis.yml
#
# GitHub Action : Build & Deploy du registry mt-registry
#
# Se déclenche :
#   - Manuellement (workflow_dispatch)
#   - Via webhook depuis n'importe quel package mt-* (repository_dispatch)
#   - À chaque modification de satis.json sur main

name: Build & Deploy Registry

on:
  workflow_dispatch:

  repository_dispatch:
    types:
      - satis-update

  push:
    branches:
      - main
    paths:
      - satis.json

# Permissions explicites pour pouvoir écrire sur gh-pages
permissions:
  contents: write

jobs:
  build:
    name: Build mt-registry
    runs-on: ubuntu-latest

    steps:
      # 1. Récupérer le code du repo mt-registry
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Corriger les permissions Git pour Docker
      - name: Fix Git ownership for Docker
        run: |
          git config --global --add safe.directory /build
          git config --global --add safe.directory $(pwd)

      # 3. Construire le registry via l'image Docker officielle de Satis
      #    → --skip-errors : ignore les repos vides ou inaccessibles
      - name: Build Registry
        run: |
          docker run --rm \
            --user $(id -u):$(id -g) \
            -e COMPOSER_AUTH='{"github-oauth":{"github.com":"${{ secrets.SATIS_GITHUB_TOKEN }}"}}' \
            -e COMPOSER_HOME=/tmp/composer \
            -v $(pwd):/build \
            composer/satis build /build/satis.json /build/public --skip-errors

      # 4. Déployer sur GitHub Pages
      #    → force_orphan : crée la branche gh-pages proprement si elle n'existe pas
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: true
          force_orphan: false
          commit_message: "chore: rebuild mt-registry [${{ github.event_name }}]"