# .github/workflows/notify-registry.yml
#
# À placer dans CHAQUE package mt-* (mt-foundation, mt-school, etc.)
#
# Rôle : Notifier mt-registry après chaque push sur main ou création de tag,
#         afin que le registry soit automatiquement reconstruit.
#
# Prérequis :
#   Ajouter le secret SATIS_DISPATCH_TOKEN dans chaque repo mt-*
#   (ou en Organization Secret pour ne le faire qu'une seule fois)

name: Notify mt-registry

on:
  # À chaque push sur la branche principale
  push:
    branches:
      - main

  # À chaque nouveau tag de version (ex: v1.0.0)
  create:
    tags:
      - 'v*'

jobs:
  notify:
    name: Trigger registry rebuild
    runs-on: ubuntu-latest

    steps:
      - name: Dispatch event to mt-registry
        uses: peter-evans/repository-dispatch@v3
        with:
          # Token avec accès "repo" sur martaf-labs/mt-registry
          token: ${{ secrets.SATIS_DISPATCH_TOKEN }}

          # Repo cible : le registry
          repository: martaf-labs/mt-registry

          # Type d'événement écouté dans satis.yml
          event-type: satis-update

          # Informations de contexte pour les logs
          client-payload: |
            {
              "package": "${{ github.repository }}",
              "ref": "${{ github.ref }}",
              "sha": "${{ github.sha }}"
            }
